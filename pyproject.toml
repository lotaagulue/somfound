[project]
name = "somfound"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lota Agulue", email = "127261799+lotaagulue@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mistralai>=2.9.1",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
somfound = "somfound:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
